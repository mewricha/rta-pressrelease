<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คลังข่าวแจก ทีมโฆษกกองทัพบก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg0: #0f1117;
  --bg1: #1a1d27;
  --bg2: #242837;
  --bg3: #2e3347;
  --border: #2e3347;
  --text: #e2e8f0;
  --text2: #94a3b8;
  --green: #4ade80;
  --yellow: #fbbf24;
  --red: #f87171;
  --blue: #60a5fa;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

/* หน้าเดียวเลื่อนยาวได้ (ไม่ fix ความสูงเหมือนเดิม) */
body {
  font-family: 'Sarabun', system-ui, -apple-system, sans-serif;
  background: var(--bg0);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Loading ── */
#overlay {
  position: fixed; inset: 0;
  background: var(--bg0);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 14px; z-index: 999;
}
.spinner {
  width: 42px; height: 42px;
  border: 3px solid var(--border);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#load-msg { color: var(--text2); font-size: 0.9rem; }
#load-bar-wrap { width: 220px; height: 4px; background: var(--bg2); border-radius: 2px; overflow: hidden; }
#load-bar { height: 100%; width: 0; background: var(--green); transition: width 0.3s; }

/* ── Topbar (header + ตัวกรอง) ตรึงบนสุดเมื่อเลื่อนหน้า ── */
.topbar { position: sticky; top: 0; z-index: 90; background: var(--bg0); }
/* ── Header ── */
.header {
  background: var(--bg1);
  border-bottom: 1px solid var(--border);
  padding: 9px 18px;
  display: flex; align-items: center; gap: 14px;
}
.header-title { font-size: 1rem; font-weight: 700; color: var(--green); }
.header-sub { font-size: 0.72rem; color: var(--text2); }
.header-stats { margin-left: auto; display: flex; gap: 18px; }
.stat-num { font-size: 1.05rem; font-weight: 700; color: var(--green); display: block; text-align: center; }
.stat-label { font-size: 0.65rem; color: var(--text2); display: block; text-align: center; }

/* ── หน้าเดียว: โครง A–G ── */
.page { padding: 12px 16px 34px; display: flex; flex-direction: column; gap: 12px; }
.panel { background: var(--bg1); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
.panel-title { font-size: 0.72rem; color: var(--yellow); margin-bottom: 12px; }

/* โซน A — แถบตัวกรอง (บรรทัดเดียว, อยู่ใน topbar ตรึงบน) */
.zone-a {
  margin: 9px 16px 10px;
  background: var(--bg1); border: 1px solid var(--border); border-radius: 10px;
  padding: 8px 10px;
  display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center;
}
.zone-a .zone-lbl { font-size: 0.68rem; color: var(--yellow); font-weight: 600; white-space: nowrap; flex: 0 0 auto; }
.zone-a .ms-wrap { flex: 1 1 185px; min-width: 0; position: relative; }
/* บังคับตัดขึ้นบรรทัดใหม่ (ล็อกตัวกรองเป็น 2 แถวตามลำดับที่กำหนด) */
.zone-break { flex-basis: 100%; height: 0; margin: 0; }
/* dropdown ในแถบแนวนอน — ลอยทับด้านล่าง */
.zone-a .ms-panel { position: absolute; z-index: 70; left: 0; right: 0; min-width: 190px; border-radius: 6px; }
/* อักษรตัวกรองขนาดเท่ากันทุกช่อง */
.zone-a .ms-trigger { font-size: 0.78rem; padding: 6px 7px; }
.zone-a .ms-trigger-label { font-size: 0.66rem; }
.z-date { font-size: 0.78rem; color: var(--yellow); display: inline-flex; align-items: center; gap: 3px; flex: 0 0 auto; white-space: nowrap; }
.z-date input {
  background: var(--bg2); border: 1px solid var(--border); color: var(--text);
  border-radius: 6px; padding: 5px; font-family: inherit; font-size: 0.78rem;
  outline: none; color-scheme: dark; width: 118px;
}
.z-date input:focus { border-color: var(--green); }

/* ปุ่มล้างตัวกรอง (ย้ายมาอยู่ใน header ขวาสุด) */
.btn-header-reset {
  flex-shrink: 0; margin-left: 16px;
  background: none; border: 1px solid var(--border);
  color: var(--text2); font-size: 0.78rem;
  padding: 6px 12px; border-radius: 6px;
  cursor: pointer; font-family: inherit; white-space: nowrap; transition: all 0.12s;
}
.btn-header-reset:hover { border-color: var(--red); color: var(--red); }

/* แถว C | D */
.row-cd { display: flex; gap: 12px; align-items: stretch; }
.zone-c { flex: 1 1 auto; min-width: 0; }
.zone-d { flex: 0 0 22.5%; max-width: 22.5%; min-width: 0; }

/* แถว F | G */
.row-fg { display: flex; gap: 12px; align-items: stretch; height: 78vh; }
.zone-f {
  flex: 0 0 30%; min-width: 0;
  background: var(--bg1); border: 1px solid var(--border); border-radius: 10px;
  display: flex; flex-direction: column; overflow: hidden;
}
.zone-g {
  flex: 1 1 auto; min-width: 0;
  background: var(--bg0); border: 1px solid var(--border); border-radius: 10px;
  display: flex; flex-direction: column; overflow: hidden;
}

/* ── MultiSelect ── */
.ms-wrap { position: relative; }
.ms-trigger {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 8px;
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.82rem;
  display: flex; align-items: center; gap: 6px;
  text-align: left;
  transition: border-color 0.12s;
  min-height: 32px;
}
.ms-trigger:hover { border-color: #4a5568; }
.ms-trigger.open, .ms-trigger.has-value { border-color: var(--green); }
.ms-trigger-label { color: var(--yellow); font-size: 0.72rem; min-width: 0; flex-shrink: 0; }
.ms-trigger-val { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.ms-trigger.has-value .ms-trigger-val { color: var(--green); font-weight: 500; }
.ms-caret { margin-left: auto; flex-shrink: 0; color: var(--text2); font-size: 0.65rem; transition: transform 0.15s; }
.ms-trigger.open .ms-caret { transform: rotate(180deg); }

.ms-panel {
  background: var(--bg2);
  border: 1px solid var(--green);
  border-radius: 6px;
  overflow: hidden;
}
.ms-panel[hidden] { display: none; }
.ms-search-wrap { padding: 6px; border-bottom: 1px solid var(--border); }
.ms-search {
  width: 100%; background: var(--bg0);
  border: 1px solid var(--border);
  color: var(--text); padding: 4px 7px;
  border-radius: 4px; font-size: 0.78rem;
  font-family: inherit; outline: none;
}
.ms-search:focus { border-color: var(--green); }
.ms-list { max-height: 220px; overflow-y: auto; padding: 3px 0; }
.ms-item {
  display: flex; align-items: flex-start; gap: 7px;
  padding: 4px 8px; cursor: pointer;
  font-size: 0.8rem; line-height: 1.35;
  transition: background 0.1s, opacity 0.15s;
}
.ms-item:hover { background: var(--bg3); }
.ms-item.checked { color: var(--green); }
.ms-item input[type=checkbox] {
  accent-color: var(--green);
  flex-shrink: 0; margin-top: 2px;
  cursor: pointer;
}
.ms-item-label { flex: 1; word-break: break-word; }
.ms-footer {
  display: flex; justify-content: flex-end;
  padding: 4px 6px;
  border-top: 1px solid var(--border);
}
.ms-clear-btn {
  background: none; border: none;
  color: var(--text2); font-size: 0.72rem;
  cursor: pointer; font-family: inherit;
  padding: 2px 6px; border-radius: 3px;
}
.ms-clear-btn:hover { color: var(--red); }
.ms-empty { padding: 8px; font-size: 0.78rem; color: var(--text2); text-align: center; }
.ms-item.unavailable { opacity: 0.28; }
.ms-item.unavailable:not(.checked) { pointer-events: none; }

/* ── List (โซน F) ── */
.search-wrap { padding: 10px; border-bottom: 1px solid var(--border); background: var(--bg1); flex-shrink: 0; }
.search-row { display: flex; gap: 6px; align-items: stretch; }
.search-input {
  flex: 1; min-width: 0; background: var(--bg2); border: 1px solid var(--border);
  color: var(--text); padding: 7px 11px; border-radius: 7px;
  font-size: 0.88rem; font-family: inherit; outline: none;
}
.search-input:focus { border-color: var(--green); }
.btn-search {
  flex-shrink: 0; background: var(--green); border: 1px solid var(--green);
  color: #fff; padding: 7px 14px; border-radius: 7px; cursor: pointer;
  font-size: 0.85rem; font-family: inherit; font-weight: 600; white-space: nowrap;
}
.btn-search:hover { filter: brightness(1.12); }
.btn-search:active { filter: brightness(0.95); }
.btn-search-clear {
  flex-shrink: 0; background: var(--bg2); border: 1px solid var(--border);
  color: var(--text2); padding: 7px 11px; border-radius: 7px; cursor: pointer;
  font-size: 0.85rem; font-family: inherit;
}
.btn-search-clear:hover { border-color: var(--green); color: var(--text); }
.sort-bar {
  padding: 5px 10px; border-bottom: 1px solid var(--border); background: var(--bg1);
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
.sort-label { font-size: 0.68rem; color: var(--green); }
.btn-sort {
  margin-left: auto; background: var(--bg2); border: 1px solid var(--border);
  color: var(--text2); font-size: 0.7rem; padding: 3px 9px; border-radius: 4px;
  cursor: pointer; font-family: inherit; transition: all 0.12s;
}
.btn-sort:hover { border-color: var(--green); color: var(--green); }
.btn-sort.asc { border-color: var(--green); color: var(--green); }
.results-bar { padding: 6px 12px; font-size: 0.72rem; color: var(--text2); border-bottom: 1px solid var(--border); background: var(--bg1); flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#results-count { color: var(--yellow); font-weight: 600; }
.export-btns { display: flex; gap: 6px; flex-shrink: 0; }
.btn-export { background: var(--bg2); border: 1px solid var(--border); color: var(--text2); font-size: 0.68rem; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-family: inherit; white-space: nowrap; transition: all 0.12s; }
.btn-export:hover:not(:disabled) { border-color: var(--green); color: var(--green); }
.btn-export:disabled { opacity: 0.4; cursor: default; }
.btn-export.done { border-color: var(--green); color: var(--green); }
.results-list { flex: 1; overflow-y: auto; }
.empty-msg { padding: 32px 16px; text-align: center; color: var(--text2); font-size: 0.85rem; }

/* ── News card ── */
.news-card {
  padding: 12px 14px; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background 0.12s;
  border-left: 3px solid transparent;
}
.news-card:hover { background: var(--bg2); }
.news-card.active { background: var(--bg2); border-left-color: var(--green); }
.card-date { font-size: 0.68rem; color: var(--text2); margin-bottom: 4px; }
.card-title { font-size: 0.85rem; font-weight: 500; line-height: 1.45; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-badges { display: flex; flex-wrap: wrap; gap: 4px; }

/* ── Badges ── */
.badge { font-size: 0.63rem; padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border); color: var(--text2); background: var(--bg2); white-space: nowrap; }
.badge.cat { border-color: #2d3d80; color: #93c5fd; background: #0f1833; }
.badge.ok  { border-color: #1a5c2e; color: var(--green); background: #071510; }
.badge.flag { border-color: #7c2020; color: var(--red); background: #160808; }
.badge.tag { border-color: #1a5c2e; color: var(--green); background: #071510; }

/* ── Detail (โซน G) ── */
.detail-panel { flex: 1; overflow-y: auto; padding: 22px 26px; background: var(--bg0); }
.detail-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text2); gap: 10px; opacity: 0.45; }
.detail-empty svg { width: 52px; height: 52px; }
.d-ref { font-size: 0.72rem; color: var(--text2); margin-bottom: 6px; }
.d-title { font-size: 1.2rem; font-weight: 700; line-height: 1.45; margin-bottom: 10px; }
.d-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.d-badge { font-size: 0.78rem; padding: 3px 10px; border-radius: 4px; border: 1px solid var(--border); }
/* ข้อมูลแบบ "ชื่อหัว : ค่า" บรรทัดเดียว จัด 2–3 คอลัมน์อัตโนมัติ ลดความสูง */
.info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 7px 24px; background: var(--bg1); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 18px; }
.info-field { display: flex; gap: 6px; align-items: baseline; font-size: 0.86rem; line-height: 1.45; }
.info-field label { flex: 0 0 auto; font-size: 0.72rem; color: var(--text2); white-space: nowrap; }
.info-field label::after { content: ' :'; }
.info-field span { flex: 1 1 auto; min-width: 0; word-break: break-word; }
.info-field.wide { grid-column: 1 / -1; }
.info-field a { color: var(--blue); }
.section-label { font-size: 0.68rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; margin-top: 18px; }
.d-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
.full-text { font-size: 0.9rem; line-height: 1.85; white-space: pre-wrap; background: var(--bg1); border: 1px solid var(--border); border-radius: 8px; padding: 16px; color: var(--text); }
.d-toolbar { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
.btn-doc { background: var(--bg1); border: 1px solid var(--border); color: var(--text); font-size: 0.78rem; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-family: inherit; white-space: nowrap; transition: all 0.12s; }
.btn-doc:hover { border-color: var(--green); color: var(--green); }
.btn-doc.done { border-color: var(--green); color: var(--green); }

/* ── Charts (โซน C: รายเดือน) ── */
.mchart-area { position: relative; height: 190px; }
.mchart-grid {
  position: absolute; inset: 0;
  background-image: linear-gradient(to top, var(--border) 1px, transparent 1px);
  background-size: 100% 25%;
  background-position: bottom;
  background-repeat: repeat-y;
  pointer-events: none;
}
.mchart { position: relative; z-index: 1; display: flex; align-items: stretch; gap: 4px; height: 100%; }
.mchart.dense { gap: 1px; }
.mcol { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; cursor: pointer; }
.mbar-area { width: 100%; height: 100%; display: flex; align-items: flex-end; }
.mbar { position: relative; width: 100%; background: #2e6b45; border-radius: 3px 3px 0 0; min-height: 2px; transition: background 0.12s; }
.mcol:hover .mbar { background: #3a8a58; }
.mbar.max { background: var(--green); }
.mbar.sel { background: var(--yellow); }
.mcol:hover .mbar.sel { background: #fcd34d; }
.mval {
  position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
  margin-bottom: 3px; font-size: 0.62rem; color: var(--text2); white-space: nowrap;
}
.mchart.dense .mval { font-size: 0.5rem; }
.mchart-x { display: flex; gap: 4px; margin-top: 6px; }
.mchart-x.dense { gap: 1px; }
.mlbl { flex: 1; min-width: 0; font-size: 0.62rem; color: var(--text); text-align: center; white-space: nowrap; }
.mchart-x.dense .mlbl { font-size: 0.5rem; }
.mchart-x.rotate { margin-top: 4px; height: 30px; }
.mchart-x.rotate .mlbl { transform: rotate(-40deg); transform-origin: top right; text-align: right; white-space: nowrap; }

/* ── Charts (โซน D: ประเภท) — ชื่อ+แท่ง อยู่บรรทัดเดียวกัน ── */
.hbar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; cursor: pointer; padding: 3px 4px; border-radius: 5px; transition: background 0.12s; }
.hbar-row:hover { background: var(--bg2); }
.hbar-row.sel { background: #1a1608; box-shadow: inset 0 0 0 1px #7a5c12; }
.hbar-lbl { flex: 0 0 38%; min-width: 0; font-size: 0.72rem; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar-row.sel .hbar-lbl { color: var(--yellow); }
.hbar-track { flex: 1 1 auto; height: 8px; background: var(--bg3); border-radius: 5px; overflow: hidden; }
.hbar-fill { height: 100%; background: var(--green); border-radius: 5px; }
.hbar-row.sel .hbar-fill { background: var(--yellow); }
.hbar-num { flex: 0 0 auto; font-size: 0.7rem; color: var(--text2); min-width: 26px; text-align: right; }

/* ── Tags (โซน E) ── */
.dash-tags-wrap { display: flex; flex-wrap: wrap; gap: 7px; }
.dash-tagpill {
  font-size: 0.78rem; color: var(--green); border: 1px solid #1a5c2e; background: #071510;
  border-radius: 5px; padding: 3px 10px; cursor: pointer; user-select: none; transition: all 0.12s;
}
.dash-tagpill:hover { filter: brightness(1.2); }
.dash-tagpill.active { border-color: #7c2020; color: var(--red); background: #160808; }
.dash-empty { color: var(--text2); font-size: 0.8rem; padding: 20px; text-align: center; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #3a4060; }

/* ── Responsive ── */
@media (max-width: 900px) {
  .zone-a { flex-wrap: wrap; }
  .zone-a .ms-wrap { flex: 1 1 140px; }
  .row-cd, .row-fg { flex-direction: column; }
  .zone-d { flex-basis: auto; max-width: none; }
  .row-fg { height: auto; }
  .zone-f { height: 55vh; }
  .zone-g { min-height: 60vh; }
  .header-sub { display: none; }
}
@media (max-width: 560px) {
  .header-stats { display: none; }
  .zone-a .ms-wrap { flex-basis: 100%; }
}

/* ── Print: เฉพาะเนื้อหาข่าวที่เปิดอยู่ ── */
@media print {
  body { overflow: visible; }
  #overlay, .topbar, .row-cd, .zone-e, .zone-f, .d-toolbar { display: none !important; }
  .page { padding: 0; gap: 0; }
  .row-fg { display: block; height: auto; }
  .zone-g { border: none; }
  .detail-panel { overflow: visible; padding: 0; background: #fff !important; }
  .detail-panel, .detail-content, .d-title, .d-ref, .section-label, .info-field label, .info-field span, .full-text, .d-badge, a { color: #000 !important; }
  .full-text, .info-grid { background: #fff !important; border-color: #999 !important; }
  .full-text { white-space: pre-wrap; }
}
</style>
</head>
<body>

<!-- Loading -->
<div id="overlay">
  <div class="spinner"></div>
  <div id="load-msg">กำลังเตรียมระบบ...</div>
  <div id="load-bar-wrap"><div id="load-bar"></div></div>
</div>

<!-- Topbar: Header + ตัวกรอง (ตรึงบนสุด) -->
<div class="topbar">
  <div class="header">
    <div>
      <div class="header-title">📰 คลังข่าวแจก ทีมโฆษกกองทัพบก</div>
      <div class="header-sub">ระบบจัดเก็บ ค้นหา และสรุปข่าวแจก ทบ.</div>
    </div>
    <div class="header-stats" id="hdr-stats"></div>
    <button class="btn-header-reset" id="btn-reset">✕ ล้างตัวกรอง</button>
  </div>
  <!-- โซน A: ตัวกรอง (บรรทัดเดียว) -->
  <div class="zone-a" id="zone-a">
    <span class="zone-lbl">ตัวกรอง</span>
    <!-- บรรทัด 1: ประเภท · ปี · เดือน · ตั้งแต่ · ถึง · สถานะตรวจสอบ -->
    <div id="ms-cat" class="ms-wrap"></div>
    <div id="ms-year" class="ms-wrap"></div>
    <div id="ms-month" class="ms-wrap"></div>
    <label class="z-date">ตั้งแต่ <input type="date" id="dash-from"></label>
    <label class="z-date">ถึง <input type="date" id="dash-to"></label>
    <div id="ms-status" class="ms-wrap"></div>
    <div class="zone-break"></div>
    <!-- บรรทัด 2: แท็ก · จังหวัด · สถานที่ · หน่วย · บุคคล -->
    <div id="ms-tag" class="ms-wrap"></div>
    <div id="ms-province" class="ms-wrap"></div>

// โหลด DB จาก origin เดียวกัน (GitHub Pages / Fastly CDN) — เลี่ยง 429 ของ raw.githubusercontent.com

// ── Helpers ──────────────────────────────────────────

function fmtDate(s) {
  if (!s) return '—';
  try {
    const p = s.slice(0,10).split('-');
    return `${parseInt(p[2])} ${MONTHS[parseInt(p[1])]} ${parseInt(p[0])+543}`;
  } catch(e) { return s; }
}
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function q(sql, params=[]) {
  try {
    const stmt = DB.prepare(sql);
    stmt.bind(params);
    const rows = [];
    while (stmt.step()) rows.push(stmt.getAsObject());
    stmt.free();
    return rows;
  } catch(e) { console.error('SQL:', e.message, sql); return []; }
}
function q1(sql, params=[]) { const r = q(sql,params); return r[0]||null; }
function setLoad(msg, pct) {

// ── MultiSelect class ─────────────────────────────────

class MultiSelect {
  constructor(containerId, { label, options, searchable = false, placeholder = 'ทั้งหมด', onChange = null }) {
    this.id = containerId;
    this.label = label;
    this.placeholder = placeholder;
    this.searchable = searchable;
    this.allOptions = options; // [{value, text}]
    this.selected = new Set();
    this._availableSet = null; // Set<string> ของค่าที่ยังมีข่าว; null = ทั้งหมด
    this.onChange = onChange || apply; // callback เมื่อค่าเปลี่ยน (ดีฟอลต์ = อัปเดตทั้งหน้า)
    this._build();
  }

  _build() {
    const wrap = document.getElementById(this.id);
    wrap.innerHTML = `
      <button class="ms-trigger" type="button">
        <span class="ms-trigger-label">${this.label}</span>
        <span class="ms-trigger-val">${this.placeholder}</span>
        <span class="ms-caret">▾</span>
      </button>
      <div class="ms-panel" hidden>
        ${this.searchable ? '<div class="ms-search-wrap"><input class="ms-search" placeholder="ค้นหา…" autocomplete="off"></div>' : ''}
        <div class="ms-list"></div>
        <div class="ms-footer">
          <button class="ms-clear-btn" type="button">ล้างการเลือก</button>
        </div>
      </div>`;

    this._trigger = wrap.querySelector('.ms-trigger');
    this._panel   = wrap.querySelector('.ms-panel');
    this._listEl  = wrap.querySelector('.ms-list');
    this._valEl   = wrap.querySelector('.ms-trigger-val');

    this._renderList(this.allOptions);

    this._trigger.addEventListener('click', e => { e.stopPropagation(); this.toggle(); });
    this._panel.addEventListener('click', e => e.stopPropagation());

    wrap.querySelector('.ms-clear-btn').addEventListener('click', () => {
      this.clear(); this.onChange();
    });

    if (this.searchable) {
      const searchEl = wrap.querySelector('.ms-search');
      searchEl.addEventListener('input', () => {
        const qStr = searchEl.value.toLowerCase();
        const filtered = qStr
          ? this.allOptions.filter(o => o.text.toLowerCase().includes(qStr))
          : this.allOptions;
        this._renderList(filtered);
      });
    }
  }

  _renderList(opts) {
    if (!opts.length) {
      this._listEl.innerHTML = '<div class="ms-empty">ไม่มีข้อมูล</div>';
      return;
    }
    this._listEl.innerHTML = opts.map(o => `
      <label class="ms-item${this.selected.has(String(o.value)) ? ' checked' : ''}">
        <input type="checkbox" value="${esc(String(o.value))}"${this.selected.has(String(o.value)) ? ' checked' : ''}>
        <span class="ms-item-label">${esc(o.text)}</span>
      </label>`).join('');

    this._listEl.querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.addEventListener('change', () => {
        const val = String(cb.value);
        if (cb.checked) this.selected.add(val);
        else this.selected.delete(val);
        cb.closest('.ms-item').classList.toggle('checked', cb.checked);
        this._updateVal();
        this.onChange();
      });
    });

    this._applyAvailability();
  }

  _applyAvailability() {
    if (!this._availableSet) return;
    this._listEl.querySelectorAll('.ms-item').forEach(item => {
      const cb = item.querySelector('input[type=checkbox]');
      if (!cb) return;
      const avail = this._availableSet.has(String(cb.value));
      item.classList.toggle('unavailable', !avail);
    });
  }

  updateAvailability(availableSet) {
    this._availableSet = availableSet;
    this._applyAvailability();
  }

  _updateVal() {
    const n = this.selected.size;
    const hasVal = n > 0;
    this._trigger.classList.toggle('has-value', hasVal);
    if (!hasVal) { this._valEl.textContent = this.placeholder; return; }
    if (n === 1) {
      const v = [...this.selected][0];
      const opt = this.allOptions.find(o => String(o.value) === v);
      this._valEl.textContent = opt ? opt.text : v;
    } else {
      this._valEl.textContent = `${n} ที่เลือก`;
    }
  }

  open() {
    Object.values(msFilters).forEach(ms => { if (ms !== this) ms.close(); });
    this._panel.hidden = false;
    this._trigger.classList.add('open');
    const searchEl = document.querySelector(`#${this.id} .ms-search`);
    const qStr = searchEl ? searchEl.value.toLowerCase() : '';
    const filtered = qStr ? this.allOptions.filter(o => o.text.toLowerCase().includes(qStr)) : this.allOptions;
    this._renderList(filtered);
  }

  close() {
    this._panel.hidden = true;
    this._trigger.classList.remove('open');
  }

  toggle() { this._panel.hidden ? this.open() : this.close(); }

  clear() {
    this.selected.clear();
    this._renderList(this.allOptions);
    this._updateVal();
  }

  // toggle ค่าเดียวจากภายนอก (คลิกกราฟ/แท็ก) แล้ว sync label
  toggleValue(val) {
    val = String(val);
    if (this.selected.has(val)) this.selected.delete(val);
    else this.selected.add(val);
    this._renderList(this.allOptions);
    this._updateVal();
  }

  getSelected() { return [...this.selected]; }
}

// ── Download DB (retry + backoff + fallback) ─────────
async function fetchDb() {
  const urls = [DB_URL, DB_URL_FALLBACK];
  let lastErr;
  for (const url of urls) {
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        const res = await fetch(url, { cache: 'default' });
        if (res.ok) return res;
        lastErr = new Error(`HTTP ${res.status}`);
        if (res.status === 429 || res.status >= 500) {
          const wait = 800 * Math.pow(2, attempt);
          setLoad(`เซิร์ฟเวอร์ไม่ว่าง (HTTP ${res.status}) — ลองใหม่ใน ${Math.round(wait/1000)} วิ…`, 15);
          await new Promise(r => setTimeout(r, wait));
          continue;
        }
        break;
      } catch (e) {
        lastErr = e;
        await new Promise(r => setTimeout(r, 600));
      }
    }
  }
  throw lastErr || new Error('โหลดฐานข้อมูลไม่สำเร็จ');
}

// ── Boot ─────────────────────────────────────────────

async function boot() {
  setLoad('กำลังโหลด sql.js…', 10);
  const SQL = await initSqlJs({
    locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}`
  });

  setLoad('กำลังดาวน์โหลดฐานข้อมูล…', 20);
  const res = await fetchDb();
  const total = parseInt(res.headers.get('content-length') || '29000000');
  const reader = res.body.getReader();
  const chunks = [];
  let received = 0;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    setLoad(`กำลังดาวน์โหลด… (${Math.round(received/1024)} KB)`, 20 + Math.round((received/total)*65));
  }

  setLoad('กำลังเปิดฐานข้อมูล…', 88);
  const buf = new Uint8Array(received);
  let off = 0;
  for (const c of chunks) { buf.set(c, off); off += c.length; }
  DB = new SQL.Database(buf);

  setLoad('พร้อมใช้งาน', 100);
  await new Promise(r => setTimeout(r, 150));
  document.getElementById('overlay').style.display = 'none';

  initUI();
  apply();
}

// ── ตัวกรองช่วงวันที่ (always-on) ──────────────────────
function globalExtra() {
  const wheres = [], params = [];
  const from = document.getElementById('dash-from').value;
  const to   = document.getElementById('dash-to').value;
  if (from) { wheres.push('pr.publish_date >= ?'); params.push(from); }
  if (to)   { wheres.push('pr.publish_date <= ?'); params.push(to); }
  return { wheres, params };
}

// ตัวกรองเดือนจากแท่งกราฟที่เลือก (เลือกได้หลายแท่ง) — YYYY-MM
function monthExtra() {
  const wheres = [], params = [];
  if (selectedMonths.size) {
    const arr = [...selectedMonths];
    wheres.push(`strftime('%Y-%m', pr.publish_date) IN (${arr.map(() => '?').join(',')})`);
    params.push(...arr);
  }
  return { wheres, params };
}

function combineExtra(...list) {
  const wheres = [], params = [];
  for (const e of list) { wheres.push(...e.wheres); params.push(...e.params); }
  return { wheres, params };
}

// คำค้นหา (LIKE substring ครอบคลุม หัวข้อ+สรุป+เนื้อเต็ม) — คุมทั้งหน้าเมื่อกดค้นหา
// หลายคำ = AND · ใช้ LIKE เพราะ sql.js (cdnjs) ไม่ได้คอมไพล์ FTS5 มาด้วย
function searchExtra() {
  const wheres = [], params = [];
  const words = appliedSearch.split(/\s+/).filter(Boolean);
  for (const w of words) {
    const pat = '%' + w + '%';
    wheres.push('(pr.title LIKE ? OR pr.summary LIKE ? OR pr.ref_code IN (SELECT ref_code FROM press_release_content WHERE full_text LIKE ?))');
    params.push(pat, pat, pat);
  }
  return { wheres, params };
}

// ตัวกรองรวมทั้งหมด (ช่วงวันที่ + เดือนที่เลือก + คำค้นหา) — ใช้กับ รายการ/จำนวน/ประเภท/แท็ก/ตัวกรอง
function fullExtra() { return combineExtra(globalExtra(), monthExtra(), searchExtra()); }

// ── apply(): อัปเดตทุกโซนจากตัวกรองชุดเดียว ─────────────
function apply() {
  loadList();                                     // โซน F (รายการ)
  renderDashboard();                              // header, กราฟ C/D/E
  refreshFilterOptionsFor(msFilters, fullExtra()); // cascading availability
}

// ── Build IN clause helper ────────────────────────────
function buildIn(vals) {
  if (!vals.length) return null;
  return { ph: vals.map(() => '?').join(','), params: vals };
}

// ── Build WHERE conditions ────────────────────────────
function buildConditions(filterSet, excludeFilter = null, extra = null) {
  const wheres = extra ? [...extra.wheres] : [];
  const params = extra ? [...extra.params] : [];

  const FILTER_DEFS = {
    cat: vals => {
      const ci = buildIn(vals);
      if (ci) { wheres.push(`pr.category_id IN (${ci.ph})`); params.push(...ci.params); }
    },
    year: vals => {
      const yi = buildIn(vals);
      if (yi) { wheres.push(`strftime('%Y', pr.publish_date) IN (${yi.ph})`); params.push(...yi.params); }
    },
    month: vals => {
      const mi = buildIn(vals);
      if (mi) { wheres.push(`strftime('%m', pr.publish_date) IN (${mi.ph})`); params.push(...mi.params); }
    },
    status: vals => {
      const si = buildIn(vals);
      if (si) { wheres.push(`pr.review_status IN (${si.ph})`); params.push(...si.params); }
    },
    tag: vals => {
      const ti = buildIn(vals);
      if (ti) {
        wheres.push(`pr.ref_code IN (SELECT prt.press_release_ref FROM press_release_tags prt JOIN tags t ON prt.tag_id=t.id WHERE t.name IN (${ti.ph}))`);
        params.push(...ti.params);
      }
    },
    unit: vals => {
      const ui = buildIn(vals);
      if (ui) {
        wheres.push(`pr.ref_code IN (SELECT press_release_ref FROM press_release_units WHERE unit_name IN (${ui.ph}))`);
        params.push(...ui.params);
      }
    },
    prov: vals => {
      const pi = buildIn(vals);
      if (pi) {
        wheres.push(`pr.ref_code IN (SELECT press_release_ref FROM press_release_provinces WHERE province_name IN (${pi.ph}))`);
        params.push(...pi.params);
      }
    },
    place: vals => {
      const pli = buildIn(vals);
      if (pli) {
        wheres.push(`pr.ref_code IN (SELECT press_release_ref FROM press_release_places WHERE place_name IN (${pli.ph}))`);
        params.push(...pli.params);
      }
    },
    person: vals => {
      const peri = buildIn(vals);
      if (peri) {
        wheres.push(`pr.ref_code IN (SELECT press_release_ref FROM press_release_persons WHERE person_name IN (${peri.ph}))`);
        params.push(...peri.params);
      }
    },
  };

  for (const [id, fn] of Object.entries(FILTER_DEFS)) {
    if (id === excludeFilter) continue;
    fn(filterSet[id]?.getSelected() || []);
  }

  return { wheres, params };
}

// ── Refresh filter options (cascading availability) ───
const TAG_JOIN   = `FROM tags t JOIN press_release_tags prt ON t.id=prt.tag_id JOIN press_releases pr ON prt.press_release_ref=pr.ref_code LEFT JOIN categories c ON pr.category_id=c.id`;
const UNIT_JOIN  = `FROM press_release_units pru JOIN press_releases pr ON pru.press_release_ref=pr.ref_code LEFT JOIN categories c ON pr.category_id=c.id`;
const PROV_JOIN  = `FROM press_release_provinces prp JOIN press_releases pr ON prp.press_release_ref=pr.ref_code LEFT JOIN categories c ON pr.category_id=c.id`;
const PLACE_JOIN = `FROM press_release_places prpl JOIN press_releases pr ON prpl.press_release_ref=pr.ref_code LEFT JOIN categories c ON pr.category_id=c.id`;
const PERS_JOIN  = `FROM press_release_persons prpe JOIN press_releases pr ON prpe.press_release_ref=pr.ref_code LEFT JOIN categories c ON pr.category_id=c.id`;

function refreshFilterOptionsFor(filterSet, extra = null) {
  const BASE = `FROM press_releases pr LEFT JOIN categories c ON pr.category_id = c.id`;

  function getAvailSimple(excludeFilter, valueExpr) {
    const { wheres, params } = buildConditions(filterSet, excludeFilter, extra);
    const where = wheres.length ? 'WHERE ' + wheres.join(' AND ') : '';
    const rows = q(`SELECT DISTINCT ${valueExpr} v ${BASE} ${where}`, params);
    return new Set(rows.map(r => String(r.v)).filter(v => v !== 'null'));
  }

  filterSet.cat?.updateAvailability(getAvailSimple('cat', 'pr.category_id'));
  filterSet.year?.updateAvailability(getAvailSimple('year', "strftime('%Y', pr.publish_date)"));
  filterSet.month?.updateAvailability(getAvailSimple('month', "strftime('%m', pr.publish_date)"));
  filterSet.status?.updateAvailability(getAvailSimple('status', 'pr.review_status'));

  function getAvailJoined(excludeFilter, joinSql, valCol) {
    const { wheres, params } = buildConditions(filterSet, excludeFilter, extra);
    const where = wheres.length ? 'WHERE ' + wheres.join(' AND ') : '';
    const rows = q(`SELECT DISTINCT ${valCol} v ${joinSql} ${where}`, params);
    return new Set(rows.map(r => String(r.v)).filter(v => v !== 'null'));
  }

  filterSet.tag?.updateAvailability(getAvailJoined('tag', TAG_JOIN, 't.name'));
  filterSet.unit?.updateAvailability(getAvailJoined('unit', UNIT_JOIN, 'pru.unit_name'));
  filterSet.prov?.updateAvailability(getAvailJoined('prov', PROV_JOIN, 'prp.province_name'));
  filterSet.place?.updateAvailability(getAvailJoined('place', PLACE_JOIN, 'prpl.place_name'));
  filterSet.person?.updateAvailability(getAvailJoined('person', PERS_JOIN, 'prpe.person_name'));
}

// ── Render list ───────────────────────────────────────

function renderList(rows) {
  currentRows = rows;
  document.getElementById('results-count').textContent =
    rows.length ? `แสดง ${rows.length.toLocaleString()} รายการ` : 'ไม่พบข่าวที่ตรงกัน';
  const cB = document.getElementById('btn-copy-list'), xB = document.getElementById('btn-xlsx-list');
  if (cB) cB.disabled = !rows.length;
  if (xB) xB.disabled = !rows.length;

  const container = document.getElementById('results-list');
  if (!rows.length) {
    container.innerHTML = '<div class="empty-msg">ไม่พบข่าวที่ตรงกับเงื่อนไข</div>';
    return;
  }

  container.innerHTML = rows.map(r => {
    const tags = q("SELECT t.name n FROM tags t JOIN press_release_tags prt ON t.id=prt.tag_id WHERE prt.press_release_ref=? LIMIT 3", [r.ref_code]);
    const isFlag = r.review_status && r.review_status !== 'ปกติ';
    return `
      <div class="news-card${r.ref_code===activeRef?' active':''}" data-ref="${r.ref_code}">
        <div class="card-date">${fmtDate(r.publish_date)} · <span style="opacity:.6">${r.ref_code}</span></div>
        <div class="card-title">${esc(r.title)}</div>
        <div class="card-badges">
          ${r.cat ? `<span class="badge cat">${esc(r.cat)}</span>` : ''}
          ${isFlag ? `<span class="badge flag">⚑ ${esc(r.review_status)}</span>` : ''}
          ${tags.map(t=>`<span class="badge tag">${esc(t.n)}</span>`).join('')}
        </div>
      </div>`;
  }).join('');

  container.querySelectorAll('.news-card').forEach(card => {
    card.addEventListener('click', () => showDetail(card.dataset.ref));
  });
}

  if (!pr) return;

  const tags      = q("SELECT t.name n FROM tags t JOIN press_release_tags prt ON t.id=prt.tag_id WHERE prt.press_release_ref=?", [refCode]);
  const units     = q("SELECT unit_name u FROM press_release_units WHERE press_release_ref=?", [refCode]);
  const persons   = q("SELECT person_name p FROM press_release_persons WHERE press_release_ref=?", [refCode]);
  const provinces = q("SELECT province_name pv FROM press_release_provinces WHERE press_release_ref=?", [refCode]);

  if (provinces.length) infoFields += `<div class="info-field"><label>จังหวัด</label><span>${provinces.map(pv=>esc(pv.pv)).join(', ')}</span></div>`;
  if (places.length)    infoFields += `<div class="info-field wide"><label>สถานที่</label><span>${places.map(pl=>esc(pl.pl)).join(', ')}</span></div>`;
  if (pr.file_name)     infoFields += `<div class="info-field wide"><label>ชื่อไฟล์ต้นฉบับ</label><span style="color:var(--text2);font-size:.8rem">${esc(String(pr.file_name).split(/[\\/]/).pop())}</span></div>`;

  const prioBadge = pr.priority ? `<span class="d-badge" style="border-color:var(--border);color:var(--text2)">${esc(pr.priority)}</span>` : '';

  const summaryHtml = pr.summary ? `<div class="section-label">สรุปย่อ</div><div class="full-text" style="margin-bottom:0">${esc(pr.summary)}</div>` : '';

      <div class="d-toolbar">

async function copyText(text) {
  if (window.isSecureContext && navigator.clipboard) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  }
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

function flashBtn(btn, msg) {
  if (!btn) return;
  const old = btn.dataset.label || btn.textContent;
  btn.dataset.label = old;
  btn.textContent = msg; btn.classList.add('done');
  clearTimeout(btn._t);
  btn._t = setTimeout(() => { btn.textContent = old; btn.classList.remove('done'); btn.dataset.label = ''; }, 1600);
}

function buildDetailText() {
  if (!detailExport) return '';
  const d = detailExport, pr = d.pr, L = [];
  L.push(pr.title || '');
  L.push('');
  L.push('รหัสอ้างอิง: ' + pr.ref_code);
  L.push('วันที่เผยแพร่: ' + fmtDate(pr.publish_date));
  if (pr.cat)      L.push('ประเภท: ' + pr.cat);
  L.push('สถานะ: ' + (pr.review_status || 'ปกติ'));
  if (pr.priority) L.push('ระดับความสำคัญ: ' + pr.priority);
  if (d.units.length)     L.push('หน่วยที่เกี่ยวข้อง: ' + d.units.map(u => u.u).join(', '));
  if (d.persons.length)   L.push('บุคคลที่เกี่ยวข้อง: ' + d.persons.map(p => p.p).join(', '));
  if (d.provinces.length) L.push('จังหวัด: ' + d.provinces.map(pv => pv.pv).join(', '));
  if (d.tags.length)      L.push('แท็ก: ' + d.tags.map(t => t.n).join(', '));
  if (pr.fb_link)  L.push('ลิงก์ Facebook: ' + pr.fb_link);
  if (pr.notes)    L.push('หมายเหตุ: ' + pr.notes);
  if (pr.summary)  { L.push(''); L.push('สรุปย่อ'); L.push(pr.summary); }
  if (d.content && d.content.full_text) { L.push(''); L.push('เนื้อหาฉบับเต็ม'); L.push(d.content.full_text); }
  return L.join('\n');
}

async function copyDetail() {
  const txt = buildDetailText();
  if (!txt) return;
  const ok = await copyText(txt);
  flashBtn(document.getElementById('btn-copy-detail'), ok ? '✓ คัดลอกแล้ว' : '✗ ไม่สำเร็จ');
}

function getListExportData() {
  const headers = ['วันที่เผยแพร่','รหัสอ้างอิง','หัวข้อข่าว','ประเภท','สถานะ','ระดับความสำคัญ','แท็ก','หน่วยที่เกี่ยวข้อง','จังหวัด'];
  const data = currentRows.map(r => {
    const tags  = q("SELECT t.name n FROM tags t JOIN press_release_tags prt ON t.id=prt.tag_id WHERE prt.press_release_ref=?", [r.ref_code]).map(t => t.n).join(', ');
    const units = q("SELECT unit_name u FROM press_release_units WHERE press_release_ref=?", [r.ref_code]).map(u => u.u).join(', ');
    const provs = q("SELECT province_name pv FROM press_release_provinces WHERE press_release_ref=?", [r.ref_code]).map(pv => pv.pv).join(', ');
    return [ fmtDate(r.publish_date), r.ref_code, r.title || '', r.cat || '', r.review_status || 'ปกติ', r.priority || '', tags, units, provs ];
  });
  return { headers, data };
}

async function copyListTable() {
  if (!currentRows.length) return;
  const { headers, data } = getListExportData();
  const clean = v => String(v).replace(/[\t\r\n]+/g, ' ');
  const tsv = [headers.join('\t'), ...data.map(row => row.map(clean).join('\t'))].join('\n');
  const ok = await copyText(tsv);
  flashBtn(document.getElementById('btn-copy-list'), ok ? '✓ คัดลอกแล้ว' : '✗ ไม่สำเร็จ');
}

let _xlsxLoading = null;
function ensureXLSX() {
  if (window.XLSX) return Promise.resolve();
  if (_xlsxLoading) return _xlsxLoading;
  _xlsxLoading = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => res();
    s.onerror = () => rej(new Error('โหลด SheetJS ไม่สำเร็จ'));
    document.head.appendChild(s);
  });
  return _xlsxLoading;
}

async function exportListXlsx() {
  if (!currentRows.length) return;
  const btn = document.getElementById('btn-xlsx-list');
  try {
    await ensureXLSX();
    const { headers, data } = getListExportData();
    const ws = XLSX.utils.aoa_to_sheet([headers, ...data]);
    ws['!cols'] = [{wch:13},{wch:14},{wch:50},{wch:16},{wch:10},{wch:12},{wch:28},{wch:24},{wch:16}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'ข่าวแจก');
    const d = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, `ข่าวแจก_${d}.xlsx`);
    flashBtn(btn, '✓ ดาวน์โหลด');
  } catch (e) {
    flashBtn(btn, '✗ ผิดพลาด');
  }
}

function renderDashboard() {
  // ตัวกรองรวม (ช่วงวันที่ + เดือนที่เลือก + ตัวกรองอื่น) — ใช้กับ header/รายการ/ประเภท/แท็ก
  const full = buildConditions(msFilters, null, fullExtra());
  const clause = full.wheres.length ? 'WHERE ' + full.wheres.join(' AND ') : '';
  const params = full.params;

  const total = q1(`SELECT COUNT(*) n FROM press_releases pr ${clause}`, params).n;

  // header 3 ตัวเลข ปรับตามตัวกรองทั้งหมด (ข่าว / หมวดหมู่ที่มี / แท็กที่ถูกใช้)
  const filtered = Object.values(msFilters).some(ms => ms.getSelected().length)
    || selectedMonths.size
    || appliedSearch
    || document.getElementById('dash-from').value
    || document.getElementById('dash-to').value;
  const catCount = q1(`SELECT COUNT(DISTINCT pr.category_id) n FROM press_releases pr ${clause}`, params).n;
  const tagUsed  = q1(`SELECT COUNT(DISTINCT t.id) n FROM tags t JOIN press_release_tags prt ON t.id=prt.tag_id JOIN press_releases pr ON prt.press_release_ref=pr.ref_code ${clause}`, params).n;
  const setStat = (id, val) => { const el = document.getElementById(id); if (el) { el.textContent = Number(val).toLocaleString(); el.style.color = filtered ? 'var(--yellow)' : 'var(--green)'; } };
  setStat('hdr-total', total);
  setStat('hdr-cats', catCount);
  setStat('hdr-tags', tagUsed);
  const hlEl = document.getElementById('hdr-total-lbl');
  if (hlEl) hlEl.textContent = filtered ? 'ข่าว (กรองแล้ว)' : 'ข่าวทั้งหมด';

  // โซน C: รายเดือน — ไม่ใส่ตัวกรอง "เดือนที่เลือก" (กราฟจะไม่ยุบ) แต่ใส่ตัวกรองอื่น+ช่วงวันที่
  const mCond = buildConditions(msFilters, null, combineExtra(globalExtra(), searchExtra()));
  const mClause = mCond.wheres.length ? 'WHERE ' + mCond.wheres.join(' AND ') : '';
  const mParams = mCond.params;
  const mAND = mClause ? ' AND' : ' WHERE';
  const monthly = q(`SELECT strftime('%Y-%m', pr.publish_date) ym, COUNT(*) n FROM press_releases pr ${mClause}${mAND} pr.publish_date IS NOT NULL GROUP BY ym ORDER BY ym`, mParams);
  const mEl = document.getElementById('dash-monthly');
  if (!monthly.length) {
    mEl.innerHTML = '<div class="dash-empty">ไม่มีข้อมูลในช่วงที่เลือก</div>';
  } else {
    const maxN = Math.max(...monthly.map(m => m.n));
    const manyMonths = monthly.length > 8;
    const denseMonths = monthly.length > 20;
    const cols = monthly.map(m => {
      const h = maxN ? Math.round((m.n / maxN) * 82) + 3 : 3;
      const [y, mo] = m.ym.split('-');
      const sel = selectedMonths.has(m.ym) ? ' sel' : '';
      return `<div class="mcol" data-ym="${m.ym}">
        <div class="mbar-area"><div class="mbar${m.n===maxN?' max':''}${sel}" style="height:${h}%" title="${MONTHS[parseInt(mo)]} ${parseInt(y)+543}: ${m.n} ข่าว"><span class="mval">${m.n}</span></div></div>
      </div>`;
    }).join('');
    const labels = monthly.map(m => {
      const [y, mo] = m.ym.split('-');
      return `<div class="mlbl">${MONTHS[parseInt(mo)]} ${String(parseInt(y)+543).slice(-2)}</div>`;
    }).join('');
    mEl.innerHTML = `
      <div class="mchart-area">
        <div class="mchart-grid"></div>
        <div class="mchart${denseMonths ? ' dense' : ''}">${cols}</div>
      </div>
      <div class="mchart-x${manyMonths ? ' rotate' : ''}${denseMonths ? ' dense' : ''}">${labels}</div>`;
    mEl.querySelectorAll('.mcol').forEach(col => {
      col.addEventListener('click', () => toggleMonthBar(col.dataset.ym));
    });
  }

  // โซน D: ประเภท — ไม่ใส่ตัวกรอง "ประเภท" ของตัวเอง (กราฟไม่ยุบ) แต่ใส่ตัวกรองอื่น+ช่วงวันที่+เดือนที่เลือก
  const catCond = buildConditions(msFilters, 'cat', fullExtra());
  const catClause = catCond.wheres.length ? 'WHERE ' + catCond.wheres.join(' AND ') : '';
  const cats = q(`SELECT pr.category_id cid, c.name nm, COUNT(*) n FROM press_releases pr LEFT JOIN categories c ON pr.category_id=c.id ${catClause} GROUP BY pr.category_id ORDER BY n DESC`, catCond.params);
  const cEl = document.getElementById('dash-cat');
  const selCats = msFilters.cat ? msFilters.cat.getSelected() : [];
  cEl.innerHTML = cats.length
    ? cats.map(c => {
        const sel = c.cid != null && selCats.includes(String(c.cid)) ? ' sel' : '';
        return `<div class="hbar-row${sel}"${c.cid != null ? ` data-cid="${c.cid}"` : ''} title="${esc(c.nm||'(ไม่ระบุ)')}: ${c.n}">
          <div class="hbar-lbl">${esc(c.nm||'(ไม่ระบุ)')}</div>
          <div class="hbar-track"><div class="hbar-fill" style="width:${Math.round((c.n/cats[0].n)*100)}%"></div></div>
          <div class="hbar-num">${c.n}</div>
        </div>`;
      }).join('')
    : '<div class="dash-empty">ไม่มีข้อมูล</div>';
  cEl.querySelectorAll('.hbar-row[data-cid]').forEach(row => {
    row.addEventListener('click', () => toggleCatBar(row.dataset.cid));
  });

  // โซน E: แท็ก
  const tags = q(`SELECT t.name nm, COUNT(*) n FROM tags t JOIN press_release_tags prt ON t.id=prt.tag_id JOIN press_releases pr ON prt.press_release_ref=pr.ref_code ${clause} GROUP BY t.id ORDER BY n DESC LIMIT 30`, params);
  const tEl = document.getElementById('dash-tags');
  const selectedTags = msFilters.tag ? msFilters.tag.getSelected() : [];
  tEl.innerHTML = tags.length
    ? `<div class="dash-tags-wrap">${tags.map(t => {
        const active = selectedTags.includes(t.nm);
        return `<span class="dash-tagpill${active ? ' active' : ''}" data-tag="${esc(t.nm)}">${esc(t.nm)} ${t.n}</span>`;
      }).join('')}</div>`
    : '<div class="dash-empty">ไม่มีข้อมูล</div>';
  tEl.querySelectorAll('.dash-tagpill').forEach(pill => {
    pill.addEventListener('click', () => toggleTagPill(pill.dataset.tag));
  });
}

// ── Start ─────────────────────────────────────────────

boot().catch(err => {
  document.getElementById('load-msg').textContent = '❌ โหลดไม่สำเร็จ: ' + err.message;
  document.getElementById('load-bar').style.background = 'var(--red)';
  console.error(err);
});
</script>
</body>
</html>
