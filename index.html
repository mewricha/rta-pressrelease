<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คลังข่าวแจก ทีมโฆษกกองทัพบก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg0: #0f1117;
  --bg1: #1a1d27;
  --bg2: #242837;
  --bg3: #2e3347;
  --border: #2e3347;
  --text: #e2e8f0;
  --text2: #94a3b8;
  --green: #4ade80;
  --yellow: #fbbf24;
  --red: #f87171;
  --blue: #60a5fa;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Sarabun', system-ui, -apple-system, sans-serif;
  background: var(--bg0);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── Loading ── */
#overlay {
  position: fixed; inset: 0;
  background: var(--bg0);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 14px; z-index: 999;
}
.spinner {
  width: 42px; height: 42px;
  border: 3px solid var(--border);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#load-msg { color: var(--text2); font-size: 0.9rem; }
#load-bar-wrap { width: 220px; height: 4px; background: var(--bg2); border-radius: 2px; overflow: hidden; }
#load-bar { height: 100%; width: 0; background: var(--green); transition: width 0.3s; }

/* ── Header ── */
.header {
  background: var(--bg1);
  border-bottom: 1px solid var(--border);
  padding: 10px 18px;
  display: flex; align-items: center; gap: 14px;
  flex-shrink: 0;
}
.header-title { font-size: 1rem; font-weight: 700; color: var(--green); }
.header-sub { font-size: 0.72rem; color: var(--text2); }
.header-stats { margin-left: auto; display: flex; gap: 18px; }
.stat-num { font-size: 1.05rem; font-weight: 700; color: var(--green); display: block; text-align: center; }
.stat-label { font-size: 0.65rem; color: var(--text2); display: block; text-align: center; }
.stat-warn .stat-num { color: var(--yellow); }

/* ── Layout ── */
.layout { display: flex; flex: 1; overflow: hidden; }

/* ── Sidebar ── */
.sidebar {
  width: 230px; flex-shrink: 0;
  background: var(--bg1);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 10px 10px 16px;
  display: flex; flex-direction: column; gap: 4px;
}
.sidebar-section-label {
  font-size: 0.63rem; color: var(--text2);
  text-transform: uppercase; letter-spacing: 0.1em;
  padding: 8px 4px 3px;
}
.btn-reset-all {
  margin-top: 8px;
  background: none; border: 1px solid var(--border);
  color: var(--text2); font-size: 0.75rem;
  padding: 5px 8px; border-radius: 5px;
  cursor: pointer; font-family: inherit; width: 100%;
  transition: all 0.12s;
}
.btn-reset-all:hover { border-color: var(--red); color: var(--red); }

/* ── MultiSelect ── */
.ms-wrap { position: relative; }

.ms-trigger {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 8px;
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.82rem;
  display: flex; align-items: center; gap: 6px;
  text-align: left;
  transition: border-color 0.12s;
  min-height: 32px;
}
.ms-trigger:hover { border-color: #4a5568; }
.ms-trigger.open, .ms-trigger.has-value { border-color: var(--green); }
.ms-trigger-label { color: var(--text2); font-size: 0.72rem; min-width: 0; flex-shrink: 0; }
.ms-trigger-val { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.ms-trigger.has-value .ms-trigger-val { color: var(--green); font-weight: 500; }
.ms-caret { margin-left: auto; flex-shrink: 0; color: var(--text2); font-size: 0.65rem; transition: transform 0.15s; }
.ms-trigger.open .ms-caret { transform: rotate(180deg); }

.ms-panel {
  background: var(--bg2);
  border: 1px solid var(--green);
  border-top: none;
  border-radius: 0 0 6px 6px;
  overflow: hidden;
}
.ms-panel[hidden] { display: none; }
.ms-search-wrap { padding: 6px; border-bottom: 1px solid var(--border); }
.ms-search {
  width: 100%; background: var(--bg0);
  border: 1px solid var(--border);
  color: var(--text); padding: 4px 7px;
  border-radius: 4px; font-size: 0.78rem;
  font-family: inherit; outline: none;
}
.ms-search:focus { border-color: var(--green); }
.ms-list { max-height: 180px; overflow-y: auto; padding: 3px 0; }
.ms-item {
  display: flex; align-items: flex-start; gap: 7px;
  padding: 4px 8px; cursor: pointer;
  font-size: 0.8rem; line-height: 1.35;
  transition: background 0.1s, opacity 0.15s;
}
.ms-item:hover { background: var(--bg3); }
.ms-item.checked { color: var(--green); }
.ms-item input[type=checkbox] {
  accent-color: var(--green);
  flex-shrink: 0; margin-top: 2px;
  cursor: pointer;
}
.ms-item-label { flex: 1; word-break: break-word; }
.ms-footer {
  display: flex; justify-content: flex-end;
  padding: 4px 6px;
  border-top: 1px solid var(--border);
}
.ms-clear-btn {
  background: none; border: none;
  color: var(--text2); font-size: 0.72rem;
  cursor: pointer; font-family: inherit;
  padding: 2px 6px; border-radius: 3px;
}
.ms-clear-btn:hover { color: var(--red); }
.ms-empty { padding: 8px; font-size: 0.78rem; color: var(--text2); text-align: center; }

/* Unavailable option: dim items with no results in current filter set */
.ms-item.unavailable { opacity: 0.28; }
.ms-item.unavailable:not(.checked) { pointer-events: none; }

/* ── List panel ── */
.list-panel {
  width: 360px; flex-shrink: 0;
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.search-wrap { padding: 10px; border-bottom: 1px solid var(--border); background: var(--bg1); flex-shrink: 0; }
.search-input {
  width: 100%; background: var(--bg2); border: 1px solid var(--border);
  color: var(--text); padding: 7px 11px; border-radius: 7px;
  font-size: 0.88rem; font-family: inherit; outline: none;
}
.search-input:focus { border-color: var(--green); }

/* Sort bar */
.sort-bar {
  padding: 5px 10px;
  border-bottom: 1px solid var(--border);
  background: var(--bg1);
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}
.sort-label { font-size: 0.68rem; color: var(--text2); }
.btn-sort {
  margin-left: auto;
  background: var(--bg2);
  border: 1px solid var(--border);
  color: var(--text2);
  font-size: 0.7rem;
  padding: 3px 9px;
  border-radius: 4px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.12s;
}
.btn-sort:hover { border-color: var(--green); color: var(--green); }
.btn-sort.asc { border-color: var(--green); color: var(--green); }

.results-bar { padding: 6px 12px; font-size: 0.72rem; color: var(--text2); border-bottom: 1px solid var(--border); background: var(--bg1); flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.export-btns { display: flex; gap: 6px; flex-shrink: 0; }
.btn-export { background: var(--bg2); border: 1px solid var(--border); color: var(--text2); font-size: 0.68rem; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-family: inherit; white-space: nowrap; transition: all 0.12s; }
.btn-export:hover:not(:disabled) { border-color: var(--green); color: var(--green); }
.btn-export:disabled { opacity: 0.4; cursor: default; }
.btn-export.done { border-color: var(--green); color: var(--green); }
.d-toolbar { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
.btn-doc { background: var(--bg1); border: 1px solid var(--border); color: var(--text); font-size: 0.78rem; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-family: inherit; white-space: nowrap; transition: all 0.12s; }
.btn-doc:hover { border-color: var(--green); color: var(--green); }
.btn-doc.done { border-color: var(--green); color: var(--green); }
.results-list { flex: 1; overflow-y: auto; }
.empty-msg { padding: 32px 16px; text-align: center; color: var(--text2); font-size: 0.85rem; }

/* ── News card ── */
.news-card {
  padding: 12px 14px; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background 0.12s;
  border-left: 3px solid transparent;
}
.news-card:hover { background: var(--bg2); }
.news-card.active { background: var(--bg2); border-left-color: var(--green); }
.card-date { font-size: 0.68rem; color: var(--text2); margin-bottom: 4px; }
.card-title { font-size: 0.85rem; font-weight: 500; line-height: 1.45; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-badges { display: flex; flex-wrap: wrap; gap: 4px; }

/* ── Badges ── */
.badge { font-size: 0.63rem; padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border); color: var(--text2); background: var(--bg2); white-space: nowrap; }
.badge.cat { border-color: #2d3d80; color: #93c5fd; background: #0f1833; }
.badge.ok  { border-color: #1a5c2e; color: var(--green); background: #071510; }
.badge.flag { border-color: #7c2020; color: var(--red); background: #160808; }
.badge.tag { border-color: #1a5c2e; color: var(--green); background: #071510; }

/* ── Detail panel ── */
.detail-panel { flex: 1; overflow-y: auto; padding: 22px 26px; background: var(--bg0); }
.detail-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text2); gap: 10px; opacity: 0.45; }
.detail-empty svg { width: 52px; height: 52px; }
.d-ref { font-size: 0.72rem; color: var(--text2); margin-bottom: 6px; }
.d-title { font-size: 1.2rem; font-weight: 700; line-height: 1.45; margin-bottom: 10px; }
.d-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.d-badge { font-size: 0.78rem; padding: 3px 10px; border-radius: 4px; border: 1px solid var(--border); }
.info-grid { display: grid; grid-template-columns: 1fr; gap: 10px; background: var(--bg1); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 18px; }
.info-field label { font-size: 0.67rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.06em; display: block; margin-bottom: 3px; }
.info-field span { font-size: 0.88rem; line-height: 1.4; word-break: break-all; }
.info-field a { color: var(--blue); }
.section-label { font-size: 0.68rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; margin-top: 18px; }
.d-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
.full-text { font-size: 0.9rem; line-height: 1.85; white-space: pre-wrap; background: var(--bg1); border: 1px solid var(--border); border-radius: 8px; padding: 16px; color: var(--text); }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #3a4060; }

/* ── Responsive: Sidebar toggle button ── */
.btn-sidebar-toggle {
  display: none;
  background: var(--bg2);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 0.82rem;
  padding: 5px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  flex-shrink: 0;
  transition: border-color 0.12s, color 0.12s;
}
.btn-sidebar-toggle:hover { border-color: var(--green); color: var(--green); }

/* Backdrop behind sidebar drawer */
.sidebar-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 99;
}
.sidebar-overlay.open { display: block; }

/* Back button in detail panel (mobile only) */
.mobile-back-bar {
  display: none;
  align-items: center;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg1);
  flex-shrink: 0;
}
.btn-back {
  background: none; border: 1px solid var(--border);
  color: var(--text2); font-size: 0.82rem;
  cursor: pointer; font-family: inherit;
  padding: 4px 10px; border-radius: 5px;
  transition: border-color 0.12s, color 0.12s;
}
.btn-back:hover { border-color: var(--green); color: var(--green); }

/* ── Tablet (641px – 1024px): sidebar drawer + 2-column ── */
@media (max-width: 1024px) {
  .btn-sidebar-toggle { display: inline-flex; align-items: center; gap: 5px; }

  .sidebar {
    position: fixed;
    top: 0; bottom: 0; left: 0;
    z-index: 100;
    width: 240px;
    transform: translateX(-100%);
    transition: transform 0.24s ease;
  }
  .sidebar.open { transform: translateX(0); }

  .list-panel { width: 42%; min-width: 220px; }
}

/* ── Mobile (≤ 640px): single-panel slide ── */
@media (max-width: 640px) {
  .header-sub { display: none; }
  .header-stats { display: none; }

  .layout { position: relative; overflow: hidden; }

  .list-panel {
    position: absolute;
    inset: 0;
    width: 100%;
    border-right: none;
    background: var(--bg0);
    z-index: 1;
    transition: transform 0.26s ease;
  }
  .list-panel.slide-left {
    transform: translateX(-100%);
    pointer-events: none;
  }

  .detail-panel {
    position: absolute;
    inset: 0;
    padding: 0;
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform 0.26s ease;
    display: flex;
    flex-direction: column;
    z-index: 2;
  }
  .detail-panel.slide-in { transform: translateX(0); }

  .mobile-back-bar { display: flex; }
  .detail-content { padding: 14px 16px 24px; }
}

/* ── Dashboard ── */
.btn-view { margin-left: 10px; background: var(--bg2); border: 1px solid var(--border); color: var(--text); font-size: 0.8rem; padding: 6px 12px; border-radius: 7px; cursor: pointer; font-family: inherit; white-space: nowrap; flex-shrink: 0; transition: all 0.12s; }
.btn-view:hover { border-color: var(--green); color: var(--green); }
.dash-view { flex: 1; overflow-y: auto; padding: 16px 20px 30px; background: var(--bg0); }
.dash-filterbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--bg1); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; margin-bottom: 14px; }
.dash-fl { font-size: 0.62rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.08em; }
.dash-date { font-size: 0.72rem; color: var(--text2); display: inline-flex; align-items: center; gap: 5px; }
.dash-date input { background: var(--bg2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 4px 7px; font-family: inherit; font-size: 0.75rem; outline: none; color-scheme: dark; }
.dash-date input:focus { border-color: var(--green); }
.dash-msw { min-width: 150px; position: relative; }
.dash-clear { margin-left: auto; background: none; border: 1px solid var(--border); color: var(--text2); font-size: 0.72rem; padding: 5px 9px; border-radius: 6px; cursor: pointer; font-family: inherit; transition: all 0.12s; }
.dash-clear:hover { border-color: var(--red); color: var(--red); }
#dash-view .ms-panel { position: absolute; z-index: 60; left: 0; right: 0; min-width: 200px; border-radius: 6px; }
.dash-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
.dash-card { background: var(--bg1); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.dash-card .lbl { font-size: 0.7rem; color: var(--text2); }
.dash-card .num { font-size: 1.5rem; font-weight: 700; margin-top: 3px; }
.dash-row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; margin-bottom: 14px; }
.dash-panel { background: var(--bg1); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
.dash-panel-title { font-size: 0.72rem; color: var(--text2); margin-bottom: 12px; }
.mbars { display: flex; align-items: flex-end; gap: 4px; height: 120px; }
.mbar { flex: 1; background: #2e6b45; border-radius: 3px 3px 0 0; min-height: 2px; }
.mbar.max { background: var(--green); }
.mbar-x { display: flex; justify-content: space-between; font-size: 0.6rem; color: #64748b; margin-top: 6px; }
.hbar-row { margin-bottom: 9px; }
.hbar-lbl { font-size: 0.72rem; color: #cbd5e1; margin-bottom: 3px; }
.hbar-lbl span { color: var(--text2); }
.hbar-track { height: 8px; background: var(--bg3); border-radius: 5px; overflow: hidden; }
.hbar-fill { height: 100%; background: var(--green); border-radius: 5px; }
.dash-tags-wrap { display: flex; flex-wrap: wrap; gap: 7px; }
.dash-tagpill { font-size: 0.78rem; color: var(--green); border: 1px solid #1a5c2e; background: #071510; border-radius: 5px; padding: 3px 10px; }
.dash-empty { color: var(--text2); font-size: 0.8rem; padding: 20px; text-align: center; }
@media (max-width: 720px) {
  .dash-cards { grid-template-columns: repeat(2, 1fr); }
  .dash-row { grid-template-columns: 1fr; }
}

/* ── Print: เฉพาะเนื้อหาข่าวที่เปิดอยู่ บนกระดาษขาว ── */
@media print {
  body { overflow: visible; height: auto; }
  #overlay, .header, .sidebar, .sidebar-overlay, .list-panel, .mobile-back-bar, .d-toolbar, .btn-sidebar-toggle { display: none !important; }
  .layout { display: block; overflow: visible; }
  .detail-panel { position: static !important; overflow: visible; padding: 0; background: #fff !important; transform: none !important; }
  .detail-content { padding: 0 !important; }
  .detail-panel, .detail-content, .d-title, .d-ref, .section-label, .info-field label, .info-field span, .full-text, .d-badge, a { color: #000 !important; }
  .full-text, .info-grid { background: #fff !important; border-color: #999 !important; }
  .full-text { white-space: pre-wrap; }
}
</style>
</head>
<body>

<!-- Loading -->
<div id="overlay">
  <div class="spinner"></div>
  <div id="load-msg">กำลังเตรียมระบบ...</div>
  <div id="load-bar-wrap"><div id="load-bar"></div></div>
</div>

<!-- Header -->
<div class="header">
  <button class="btn-sidebar-toggle" id="btn-sidebar-toggle">☰ กรอง</button>
  <div>
    <div class="header-title">📰 คลังข่าวแจก ทีมโฆษกกองทัพบก</div>
    <div class="header-sub">ระบบจัดเก็บและค้นหาข่าวแจก ทบ.</div>
  </div>
  <div class="header-stats" id="hdr-stats"></div>
  <button class="btn-view" id="btn-view-toggle">📊 แดชบอร์ด</button>
</div>

<div class="layout">

<div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-section-label">ตัวกรอง</div>

    <div id="ms-cat" class="ms-wrap"></div>
    <div id="ms-year" class="ms-wrap"></div>
    <div id="ms-month" class="ms-wrap"></div>
    <div id="ms-status" class="ms-wrap"></div>
    <div id="ms-tag" class="ms-wrap"></div>
    <div id="ms-unit" class="ms-wrap"></div>
    <div id="ms-province" class="ms-wrap"></div>
    <div id="ms-person" class="ms-wrap"></div>

    <button class="btn-reset-all" id="btn-reset">✕ ล้างตัวกรองทั้งหมด</button>
  </div>

  <!-- List panel -->
  <div class="list-panel">
    <div class="search-wrap">
      <input class="search-input" id="search-input" type="text" placeholder="🔍 ค้นหาข่าว (ชื่อเรื่อง, เนื้อหา)…">
    </div>
    <div class="sort-bar">
      <span class="sort-label">เรียงตามวันที่เผยแพร่</span>
      <button class="btn-sort" id="btn-sort">ใหม่สุดก่อน ↓</button>
    </div>
    <div class="results-bar" id="results-bar">
      <span id="results-count">—</span>
      <div class="export-btns">
        <button class="btn-export" id="btn-copy-list" title="คัดลอกรายการที่แสดงเป็นตาราง (วางใน Excel ได้)" disabled>⧉ คัดลอกตาราง</button>
        <button class="btn-export" id="btn-xlsx-list" title="ดาวน์โหลดรายการที่แสดงเป็นไฟล์ Excel" disabled>⭳ Excel</button>
      </div>
    </div>
    <div class="results-list" id="results-list"></div>
  </div>

  <!-- Detail panel -->
  <div class="detail-panel" id="detail-panel">
    <div class="detail-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
      </svg>
      <div>เลือกข่าวจากรายการด้านซ้ายเพื่ออ่านรายละเอียด</div>

// ── Helpers ──────────────────────────────────────────

function fmtDate(s) {
  if (!s) return '—';
  try {
    const p = s.slice(0,10).split('-');
    return `${parseInt(p[2])} ${MONTHS[parseInt(p[1])]} ${parseInt(p[0])+543}`;
  } catch(e) { return s; }
}
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function q(sql, params=[]) {
  try {
    const stmt = DB.prepare(sql);
    stmt.bind(params);
    const rows = [];
    while (stmt.step()) rows.push(stmt.getAsObject());
    stmt.free();
    return rows;
  } catch(e) { console.error('SQL:', e.message, sql); return []; }
}
function q1(sql, params=[]) { const r = q(sql,params); return r[0]||null; }
function setLoad(msg, pct) {
  document.getElementById('load-msg').textContent = msg;
  if (pct != null) document.getElementById('load-bar').style.width = pct+'%';

// ── MultiSelect class ─────────────────────────────────

class MultiSelect {
  constructor(containerId, { label, options, searchable = false, placeholder = 'ทั้งหมด', onChange = null }) {
    this.id = containerId;
    this.label = label;
    this.placeholder = placeholder;
    this.searchable = searchable;
    this.allOptions = options; // [{value, text}]
    this.selected = new Set();
    this._availableSet = null; // Set<string> of available values; null = all available
    this.onChange = onChange || loadList; // callback เมื่อค่าเปลี่ยน (ดีฟอลต์ = คลังข่าว)
    this._build();
  }

  _build() {
    const wrap = document.getElementById(this.id);
    wrap.innerHTML = `
      <button class="ms-trigger" type="button">
        <span class="ms-trigger-label">${this.label}</span>
        <span class="ms-trigger-val">${this.placeholder}</span>
        <span class="ms-caret">▾</span>
      </button>
      <div class="ms-panel" hidden>
        ${this.searchable ? '<div class="ms-search-wrap"><input class="ms-search" placeholder="ค้นหา…" autocomplete="off"></div>' : ''}
        <div class="ms-list"></div>
        <div class="ms-footer">
          <button class="ms-clear-btn" type="button">ล้างการเลือก</button>
        </div>
      </div>`;

    this._trigger = wrap.querySelector('.ms-trigger');
    this._panel   = wrap.querySelector('.ms-panel');
    this._listEl  = wrap.querySelector('.ms-list');
    this._valEl   = wrap.querySelector('.ms-trigger-val');

    this._renderList(this.allOptions);

    this._trigger.addEventListener('click', e => { e.stopPropagation(); this.toggle(); });

    wrap.querySelector('.ms-clear-btn').addEventListener('click', () => {
      this.clear(); this.onChange();
    });

    if (this.searchable) {
      const searchEl = wrap.querySelector('.ms-search');
      searchEl.addEventListener('input', () => {
        const qStr = searchEl.value.toLowerCase();
        const filtered = qStr
          ? this.allOptions.filter(o => o.text.toLowerCase().includes(qStr))
          : this.allOptions;
        this._renderList(filtered);
      });
    }
  }

  _renderList(opts) {
    if (!opts.length) {
      this._listEl.innerHTML = '<div class="ms-empty">ไม่มีข้อมูล</div>';
      return;
    }
    this._listEl.innerHTML = opts.map(o => `
      <label class="ms-item${this.selected.has(String(o.value)) ? ' checked' : ''}">
        <input type="checkbox" value="${esc(String(o.value))}"${this.selected.has(String(o.value)) ? ' checked' : ''}>
        <span class="ms-item-label">${esc(o.text)}</span>
      </label>`).join('');

    this._listEl.querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.addEventListener('change', () => {
        const val = String(cb.value);
        if (cb.checked) this.selected.add(val);
        else this.selected.delete(val);
        cb.closest('.ms-item').classList.toggle('checked', cb.checked);
        this._updateVal();
        this.onChange();
      });
    });

    // Apply availability dimming after render
    this._applyAvailability();
  }

  // Mark options not in availableSet as dimmed/disabled
  _applyAvailability() {
    if (!this._availableSet) return;
    this._listEl.querySelectorAll('.ms-item').forEach(item => {
      const cb = item.querySelector('input[type=checkbox]');
      if (!cb) return;
      const avail = this._availableSet.has(String(cb.value));
      item.classList.toggle('unavailable', !avail);
    });
  }

  // Called by refreshFilterOptions() after each filter change
  updateAvailability(availableSet) {
    this._availableSet = availableSet;
    this._applyAvailability();
  }

  _updateVal() {
    const n = this.selected.size;
    const hasVal = n > 0;
    this._trigger.classList.toggle('has-value', hasVal);
    if (!hasVal) { this._valEl.textContent = this.placeholder; return; }
    if (n === 1) {
      const v = [...this.selected][0];
      const opt = this.allOptions.find(o => String(o.value) === v);
      this._valEl.textContent = opt ? opt.text : v;
    } else {
      this._valEl.textContent = `${n} ที่เลือก`;
    }
  }

  open() {
    Object.values(msFilters).forEach(ms => { if (ms !== this) ms.close(); });
    this._panel.hidden = false;
    this._trigger.classList.add('open');
    const searchEl = document.querySelector(`#${this.id} .ms-search`);
    const qStr = searchEl ? searchEl.value.toLowerCase() : '';
    const filtered = qStr ? this.allOptions.filter(o => o.text.toLowerCase().includes(qStr)) : this.allOptions;
    this._renderList(filtered);
  }

  close() {
    this._panel.hidden = true;
    this._trigger.classList.remove('open');
  }

  toggle() { this._panel.hidden ? this.open() : this.close(); }

  clear() {
    this.selected.clear();
    this._renderList(this.allOptions);
    this._updateVal();
  }

  getSelected() { return [...this.selected]; }
}

// ── Boot ─────────────────────────────────────────────

async function boot() {
  setLoad('กำลังโหลด sql.js…', 10);
  const SQL = await initSqlJs({
    locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}`
  });

  setLoad('กำลังดาวน์โหลดฐานข้อมูล (≈1.6 MB)…', 20);
  const res = await fetch(DB_URL);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);

  const total = parseInt(res.headers.get('content-length') || '1617920');
  const reader = res.body.getReader();
  const chunks = [];
  let received = 0;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    setLoad(`กำลังดาวน์โหลด… (${Math.round(received/1024)} KB)`, 20 + Math.round((received/total)*65));
  }

  setLoad('กำลังเปิดฐานข้อมูล…', 88);
  const buf = new Uint8Array(received);
  let off = 0;
  for (const c of chunks) { buf.set(c, off); off += c.length; }
  DB = new SQL.Database(buf);

  setLoad('พร้อมใช้งาน', 100);
  await new Promise(r => setTimeout(r, 150));
  document.getElementById('overlay').style.display = 'none';

  initUI();
  loadList();
}

// ── Build IN clause helper ────────────────────────────

function buildIn(vals) {
  if (!vals.length) return null;
  return { ph: vals.map(() => '?').join(','), params: vals };
}

// ── Build WHERE conditions from all active filters ────
// excludeFilter: filter id (string) to skip — used by refreshFilterOptions
// Returns { wheres: string[], params: any[] }

function buildConditions(excludeFilter = null) {
  const wheres = [];
  const params = [];

  const FILTER_DEFS = {
    cat: vals => {
      const ci = buildIn(vals);
      if (ci) { wheres.push(`pr.category_id IN (${ci.ph})`); params.push(...ci.params); }
    },
    year: vals => {
      const yi = buildIn(vals);
      if (yi) { wheres.push(`strftime('%Y', pr.publish_date) IN (${yi.ph})`); params.push(...yi.params); }
    },
    month: vals => {
      const mi = buildIn(vals);
      if (mi) { wheres.push(`strftime('%m', pr.publish_date) IN (${mi.ph})`); params.push(...mi.params); }
    },
    status: vals => {
      const si = buildIn(vals);
      if (si) { wheres.push(`pr.review_status IN (${si.ph})`); params.push(...si.params); }
    },
    tag: vals => {
      const ti = buildIn(vals);
      if (ti) {
        wheres.push(`pr.ref_code IN (SELECT prt.press_release_ref FROM press_release_tags prt JOIN tags t ON prt.tag_id=t.id WHERE t.name IN (${ti.ph}))`);
        params.push(...ti.params);
      }
    },
    unit: vals => {
      const ui = buildIn(vals);
      if (ui) {
        wheres.push(`pr.ref_code IN (SELECT press_release_ref FROM press_release_units WHERE unit_name IN (${ui.ph}))`);
        params.push(...ui.params);
      }
    },
    prov: vals => {
      const pi = buildIn(vals);
      if (pi) {
        wheres.push(`pr.ref_code IN (SELECT press_release_ref FROM press_release_provinces WHERE province_name IN (${pi.ph}))`);
        params.push(...pi.params);
      }
    },
    person: vals => {
      const peri = buildIn(vals);
      if (peri) {
        wheres.push(`pr.ref_code IN (SELECT press_release_ref FROM press_release_persons WHERE person_name IN (${peri.ph}))`);
        params.push(...peri.params);
      }
    },
  };

  for (const [id, fn] of Object.entries(FILTER_DEFS)) {
    if (id === excludeFilter) continue;
    fn(msFilters[id]?.getSelected() || []);
  }

  return { wheres, params };
}

// ── Refresh filter options (cascading / dynamic availability) ─────────────

function refreshFilterOptions() {
  // Base FROM clause shared by simple filters
  const BASE = `FROM press_releases pr LEFT JOIN categories c ON pr.category_id = c.id`;

  // Helper: get available values for a simple column expression
  function getAvailSimple(excludeFilter, valueExpr) {
    const { wheres, params } = buildConditions(excludeFilter);
    const where = wheres.length ? 'WHERE ' + wheres.join(' AND ') : '';
    const rows = q(`SELECT DISTINCT ${valueExpr} v ${BASE} ${where}`, params);
    return new Set(rows.map(r => String(r.v)).filter(v => v !== 'null'));
  }

  msFilters.cat?.updateAvailability(getAvailSimple('cat', 'pr.category_id'));
  msFilters.year?.updateAvailability(getAvailSimple('year', "strftime('%Y', pr.publish_date)"));
  msFilters.month?.updateAvailability(getAvailSimple('month', "strftime('%m', pr.publish_date)"));
  msFilters.status?.updateAvailability(getAvailSimple('status', 'pr.review_status'));

  // Many-to-many filters need their own JOIN
  function getAvailJoined(excludeFilter, joinSql, valCol) {
    const { wheres, params } = buildConditions(excludeFilter);
    const where = wheres.length ? 'WHERE ' + wheres.join(' AND ') : '';
    const rows = q(`SELECT DISTINCT ${valCol} v ${joinSql} ${where}`, params);
    return new Set(rows.map(r => String(r.v)).filter(v => v !== 'null'));
  }

  const TAG_JOIN   = `FROM tags t JOIN press_release_tags prt ON t.id=prt.tag_id JOIN press_releases pr ON prt.press_release_ref=pr.ref_code LEFT JOIN categories c ON pr.category_id=c.id`;
  const UNIT_JOIN  = `FROM press_release_units pru JOIN press_releases pr ON pru.press_release_ref=pr.ref_code LEFT JOIN categories c ON pr.category_id=c.id`;
  const PROV_JOIN  = `FROM press_release_provinces prp JOIN press_releases pr ON prp.press_release_ref=pr.ref_code LEFT JOIN categories c ON pr.category_id=c.id`;
  const PERS_JOIN  = `FROM press_release_persons prpe JOIN press_releases pr ON prpe.press_release_ref=pr.ref_code LEFT JOIN categories c ON pr.category_id=c.id`;

  msFilters.tag?.updateAvailability(getAvailJoined('tag', TAG_JOIN, 't.name'));
  msFilters.unit?.updateAvailability(getAvailJoined('unit', UNIT_JOIN, 'pru.unit_name'));
  msFilters.prov?.updateAvailability(getAvailJoined('prov', PROV_JOIN, 'prp.province_name'));
  msFilters.person?.updateAvailability(getAvailJoined('person', PERS_JOIN, 'prpe.person_name'));
}

// ── Load list ─────────────────────────────────────────

function loadList() {
  const sq = document.getElementById('search-input').value.trim();
  const { wheres, params } = buildConditions();

  let rows;

  if (sq) {
    // FTS search (sort by relevance rank)
    const ftsQ = '"' + sq.replace(/"/g,'""').replace(/\s+/g, '" OR "') + '"';
    let sql = `
      SELECT pr.ref_code, pr.publish_date, pr.title, pr.review_status, pr.priority, c.name cat
      FROM press_releases_fts fts
      JOIN press_releases pr ON fts.ref_code = pr.ref_code
      LEFT JOIN categories c ON pr.category_id = c.id
      WHERE press_releases_fts MATCH ?`;
    const p = [ftsQ, ...params];
    if (wheres.length) sql += ' AND ' + wheres.join(' AND ');
    sql += ' ORDER BY rank LIMIT 150';
    rows = q(sql, p);

    // Fallback: LIKE search (respects sortOrder)
    if (!rows.length) {
      const pat = '%' + sq + '%';
      let s2 = `
        SELECT pr.ref_code, pr.publish_date, pr.title, pr.review_status, pr.priority, c.name cat
        FROM press_releases pr
        LEFT JOIN categories c ON pr.category_id = c.id
        WHERE (pr.title LIKE ? OR pr.summary LIKE ?)`;
      const p2 = [pat, pat, ...params];
      if (wheres.length) s2 += ' AND ' + wheres.join(' AND ');
      s2 += ` ORDER BY pr.publish_date ${sortOrder} LIMIT 150`;
      rows = q(s2, p2);
    }
  } else {
    const where = wheres.length ? 'WHERE ' + wheres.join(' AND ') : '';
    rows = q(`
      SELECT pr.ref_code, pr.publish_date, pr.title, pr.review_status, pr.priority, c.name cat
      FROM press_releases pr
      LEFT JOIN categories c ON pr.category_id = c.id
      ${where}
      ORDER BY pr.publish_date ${sortOrder} LIMIT 200`, params);
  }

  renderList(rows);
  refreshFilterOptions(); // Update availability after every filter change
}

// ── Render list ───────────────────────────────────────

function renderList(rows) {
  currentRows = rows;
  document.getElementById('results-count').textContent =
    rows.length ? `แสดง ${rows.length.toLocaleString()} รายการ` : 'ไม่พบข่าวที่ตรงกัน';
  const cB = document.getElementById('btn-copy-list'), xB = document.getElementById('btn-xlsx-list');
  if (cB) cB.disabled = !rows.length;
  if (xB) xB.disabled = !rows.length;

  const container = document.getElementById('results-list');
  if (!rows.length) {
    container.innerHTML = '<div class="empty-msg">ไม่พบข่าวที่ตรงกับเงื่อนไข</div>';
    return;
  }

  container.innerHTML = rows.map(r => {
    const tags = q("SELECT t.name n FROM tags t JOIN press_release_tags prt ON t.id=prt.tag_id WHERE prt.press_release_ref=? LIMIT 3", [r.ref_code]);
    const isFlag = r.review_status && r.review_status !== 'ปกติ';
    return `
      <div class="news-card${r.ref_code===activeRef?' active':''}" data-ref="${r.ref_code}">
        <div class="card-date">${fmtDate(r.publish_date)} · <span style="opacity:.6">${r.ref_code}</span></div>
        <div class="card-title">${esc(r.title)}</div>
        <div class="card-badges">
          ${r.cat ? `<span class="badge cat">${esc(r.cat)}</span>` : ''}
          ${isFlag ? `<span class="badge flag">⚑ ${esc(r.review_status)}</span>` : ''}
          ${tags.map(t=>`<span class="badge tag">${esc(t.n)}</span>`).join('')}
        </div>
      </div>`;
  }).join('');

  container.querySelectorAll('.news-card').forEach(card => {
    card.addEventListener('click', () => showDetail(card.dataset.ref));
  });
}

// ── Show detail ───────────────────────────────────────

function showDetail(refCode) {
  activeRef = refCode;
  document.querySelectorAll('.news-card').forEach(c =>
    c.classList.toggle('active', c.dataset.ref === refCode)
  );

  // Mobile: slide to detail panel
  if (window.innerWidth <= 640) {
    document.querySelector('.list-panel').classList.add('slide-left');
    document.getElementById('detail-panel').classList.add('slide-in');
  }

  const pr = q1(`SELECT pr.*, c.name cat FROM press_releases pr LEFT JOIN categories c ON pr.category_id=c.id WHERE pr.ref_code=?`, [refCode]);
  if (!pr) return;

  const content   = q1('SELECT full_text FROM press_release_content WHERE ref_code=?', [refCode]);
  const tags      = q("SELECT t.name n FROM tags t JOIN press_release_tags prt ON t.id=prt.tag_id WHERE prt.press_release_ref=?", [refCode]);
  const units     = q("SELECT unit_name u FROM press_release_units WHERE press_release_ref=?", [refCode]);
  const persons   = q("SELECT person_name p FROM press_release_persons WHERE press_release_ref=?", [refCode]);
  const provinces = q("SELECT province_name pv FROM press_release_provinces WHERE press_release_ref=?", [refCode]);

  detailExport = { pr, content, tags, units, persons, provinces };

  const isFlag = pr.review_status && pr.review_status !== 'ปกติ';
  const statusBadge = isFlag
    ? `<span class="d-badge" style="border-color:#7c2020;color:var(--red);background:#160808">⚑ ${esc(pr.review_status)}</span>`
    : `<span class="d-badge" style="border-color:#1a5c2e;color:var(--green);background:#071510">✓ ปกติ</span>`;

  // info-grid: วันที่เหตุการณ์ ถูกตัดออก — แสดงแค่วันที่เผยแพร่
  let infoFields = `
    <div class="info-field"><label>วันที่เผยแพร่</label><span>${fmtDate(pr.publish_date)}</span></div>`;
  if (pr.event_action)  infoFields += `<div class="info-field"><label>การดำเนินการ</label><span>${esc(pr.event_action)}</span></div>`;
  if (units.length)     infoFields += `<div class="info-field"><label>หน่วยที่เกี่ยวข้อง</label><span>${units.map(u=>esc(u.u)).join(', ')}</span></div>`;
  if (persons.length)   infoFields += `<div class="info-field"><label>บุคคลที่เกี่ยวข้อง</label><span>${persons.map(p=>esc(p.p)).join(', ')}</span></div>`;
  if (provinces.length) infoFields += `<div class="info-field"><label>จังหวัด</label><span>${provinces.map(pv=>esc(pv.pv)).join(', ')}</span></div>`;
  if (pr.file_name)     infoFields += `<div class="info-field"><label>ชื่อไฟล์ต้นฉบับ</label><span style="color:var(--text2);font-size:.8rem">${esc(String(pr.file_name).split(/[\\/]/).pop())}</span></div>`;
  if (pr.fb_link)       infoFields += `<div class="info-field"><label>ลิงก์ Facebook</label><span><a href="${esc(pr.fb_link)}" target="_blank" rel="noopener">${esc(pr.fb_link)}</a></span></div>`;
  if (pr.notes)         infoFields += `<div class="info-field"><label>หมายเหตุ</label><span style="color:var(--yellow)">${esc(pr.notes)}</span></div>`;

  const catBadge  = pr.cat ? `<span class="d-badge" style="border-color:#2d3d80;color:#93c5fd;background:#0f1833">${esc(pr.cat)}</span>` : '';
  const prioBadge = pr.priority ? `<span class="d-badge" style="border-color:var(--border);color:var(--text2)">${esc(pr.priority)}</span>` : '';
  const tagsHtml  = tags.length ? `<div class="section-label">แท็ก</div><div class="d-tags">${tags.map(t=>`<span class="badge tag" style="font-size:.78rem;padding:3px 8px">${esc(t.n)}</span>`).join('')}</div>` : '';
  const summaryHtml = pr.summary ? `<div class="section-label">สรุปย่อ</div><div class="full-text" style="margin-bottom:0">${esc(pr.summary)}</div>` : '';
  const fullHtml  = content?.full_text ? `<div class="section-label" style="margin-top:18px">เนื้อหาฉบับเต็ม</div><div class="full-text">${esc(content.full_text)}</div>` : '';

  document.getElementById('detail-panel').innerHTML = `
    <div class="mobile-back-bar">
      <button class="btn-back" id="btn-back">← รายการ</button>
    </div>
    <div class="detail-content">
      <div class="d-toolbar">
        <button class="btn-doc" id="btn-copy-detail" title="คัดลอกหัวข้อ ข้อมูล และเนื้อหาทั้งหมด">⧉ คัดลอกทั้งฉบับ</button>
        <button class="btn-doc" id="btn-print-detail" title="พิมพ์ หรือบันทึกเป็น PDF">⎙ พิมพ์ / PDF</button>
      </div>
      <div class="d-ref">${esc(pr.ref_code)}</div>
      <div class="d-title">${esc(pr.title)}</div>
      <div class="d-badges">${catBadge}${statusBadge}${prioBadge}</div>
      <div class="info-grid">${infoFields}</div>
      ${summaryHtml}${tagsHtml}${fullHtml}
    </div>`;

  const backBtn = document.getElementById('btn-back');
  if (backBtn) backBtn.addEventListener('click', showList);

  const cpBtn = document.getElementById('btn-copy-detail');
  if (cpBtn) cpBtn.addEventListener('click', copyDetail);
  const prBtn = document.getElementById('btn-print-detail');
  if (prBtn) prBtn.addEventListener('click', () => window.print());
}

// ── Export helpers ────────────────────────────────────

async function copyText(text) {
  if (window.isSecureContext && navigator.clipboard) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  }
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

function flashBtn(btn, msg) {
  if (!btn) return;
  const old = btn.dataset.label || btn.textContent;
  btn.dataset.label = old;
  btn.textContent = msg; btn.classList.add('done');
  clearTimeout(btn._t);
  btn._t = setTimeout(() => { btn.textContent = old; btn.classList.remove('done'); btn.dataset.label = ''; }, 1600);
}

function buildDetailText() {
  if (!detailExport) return '';
  const d = detailExport, pr = d.pr, L = [];
  L.push(pr.title || '');
  L.push('');
  L.push('รหัสอ้างอิง: ' + pr.ref_code);
  L.push('วันที่เผยแพร่: ' + fmtDate(pr.publish_date));
  if (pr.cat)      L.push('ประเภท: ' + pr.cat);
  L.push('สถานะ: ' + (pr.review_status || 'ปกติ'));
  if (pr.priority) L.push('ระดับความสำคัญ: ' + pr.priority);
  if (d.units.length)     L.push('หน่วยที่เกี่ยวข้อง: ' + d.units.map(u => u.u).join(', '));
  if (d.persons.length)   L.push('บุคคลที่เกี่ยวข้อง: ' + d.persons.map(p => p.p).join(', '));
  if (d.provinces.length) L.push('จังหวัด: ' + d.provinces.map(pv => pv.pv).join(', '));
  if (d.tags.length)      L.push('แท็ก: ' + d.tags.map(t => t.n).join(', '));
  if (pr.fb_link)  L.push('ลิงก์ Facebook: ' + pr.fb_link);
  if (pr.notes)    L.push('หมายเหตุ: ' + pr.notes);
  if (pr.summary)  { L.push(''); L.push('สรุปย่อ'); L.push(pr.summary); }
  if (d.content && d.content.full_text) { L.push(''); L.push('เนื้อหาฉบับเต็ม'); L.push(d.content.full_text); }
  return L.join('\n');
}

async function copyDetail() {
  const txt = buildDetailText();
  if (!txt) return;
  const ok = await copyText(txt);
  flashBtn(document.getElementById('btn-copy-detail'), ok ? '✓ คัดลอกแล้ว' : '✗ ไม่สำเร็จ');
}

function getListExportData() {
  const headers = ['วันที่เผยแพร่','รหัสอ้างอิง','หัวข้อข่าว','ประเภท','สถานะ','ระดับความสำคัญ','แท็ก','หน่วยที่เกี่ยวข้อง','จังหวัด'];
  const data = currentRows.map(r => {
    const tags  = q("SELECT t.name n FROM tags t JOIN press_release_tags prt ON t.id=prt.tag_id WHERE prt.press_release_ref=?", [r.ref_code]).map(t => t.n).join(', ');
    const units = q("SELECT unit_name u FROM press_release_units WHERE press_release_ref=?", [r.ref_code]).map(u => u.u).join(', ');
    const provs = q("SELECT province_name pv FROM press_release_provinces WHERE press_release_ref=?", [r.ref_code]).map(pv => pv.pv).join(', ');
    return [ fmtDate(r.publish_date), r.ref_code, r.title || '', r.cat || '', r.review_status || 'ปกติ', r.priority || '', tags, units, provs ];
  });
  return { headers, data };
}

async function copyListTable() {
  if (!currentRows.length) return;
  const { headers, data } = getListExportData();
  const clean = v => String(v).replace(/[\t\r\n]+/g, ' ');
  const tsv = [headers.join('\t'), ...data.map(row => row.map(clean).join('\t'))].join('\n');
  const ok = await copyText(tsv);
  flashBtn(document.getElementById('btn-copy-list'), ok ? '✓ คัดลอกแล้ว' : '✗ ไม่สำเร็จ');
}

let _xlsxLoading = null;
function ensureXLSX() {
  if (window.XLSX) return Promise.resolve();
  if (_xlsxLoading) return _xlsxLoading;
  _xlsxLoading = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => res();
    s.onerror = () => rej(new Error('โหลด SheetJS ไม่สำเร็จ'));
    document.head.appendChild(s);
  });
  return _xlsxLoading;
}

async function exportListXlsx() {
  if (!currentRows.length) return;
  const btn = document.getElementById('btn-xlsx-list');
  try {
    await ensureXLSX();
    const { headers, data } = getListExportData();
    const ws = XLSX.utils.aoa_to_sheet([headers, ...data]);
    ws['!cols'] = [{wch:13},{wch:14},{wch:50},{wch:16},{wch:10},{wch:12},{wch:28},{wch:24},{wch:16}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'ข่าวแจก');
    const d = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, `ข่าวแจก_${d}.xlsx`);
    flashBtn(btn, '✓ ดาวน์โหลด');
  } catch (e) {
    flashBtn(btn, '✗ ผิดพลาด');
  }
}

// ── Dashboard ─────────────────────────────────────────

function toggleView() {
  dashMode = !dashMode;
  document.querySelector('.layout').style.display = dashMode ? 'none' : '';
  document.getElementById('dash-view').hidden = !dashMode;
  document.getElementById('btn-view-toggle').textContent = dashMode ? '📋 คลังข่าว' : '📊 แดชบอร์ด';
  if (dashMode) renderDashboard();
}

function dashWhere() {
  const w = [], p = [];
  const from = document.getElementById('dash-from').value;
  const to   = document.getElementById('dash-to').value;
  if (from) { w.push('pr.publish_date >= ?'); p.push(from); }
  if (to)   { w.push('pr.publish_date <= ?'); p.push(to); }
  const cats = dashMs.cat ? dashMs.cat.getSelected() : [];
  if (cats.length) { w.push(`pr.category_id IN (${cats.map(()=>'?').join(',')})`); p.push(...cats); }
  const tags = dashMs.tag ? dashMs.tag.getSelected() : [];
  if (tags.length) {
    w.push(`pr.ref_code IN (SELECT prt.press_release_ref FROM press_release_tags prt JOIN tags t ON prt.tag_id=t.id WHERE t.name IN (${tags.map(()=>'?').join(',')}))`);
    p.push(...tags);
  }
  return { clause: w.length ? 'WHERE ' + w.join(' AND ') : '', params: p };
}

function renderDashboard() {
  const { clause, params } = dashWhere();
  const AND = clause ? ' AND' : ' WHERE';

  const total = q1(`SELECT COUNT(*) n FROM press_releases pr ${clause}`, params).n;

  const monthly = q(`SELECT strftime('%Y-%m', pr.publish_date) ym, COUNT(*) n FROM press_releases pr ${clause}${AND} pr.publish_date IS NOT NULL GROUP BY ym ORDER BY ym`, params);
  const avg = monthly.length ? (total / monthly.length) : 0;

  const clarify = q1(`SELECT COUNT(*) n FROM press_releases pr ${clause}${AND} pr.ref_code IN (SELECT prt.press_release_ref FROM press_release_tags prt JOIN tags t ON prt.tag_id=t.id WHERE t.name=?)`, [...params, 'ชี้แจง-ตอบโต้ข่าว']).n;

  const tagCount = q1(`SELECT COUNT(DISTINCT t.id) n FROM tags t JOIN press_release_tags prt ON t.id=prt.tag_id JOIN press_releases pr ON prt.press_release_ref=pr.ref_code ${clause}`, params).n;

  document.getElementById('dash-cards').innerHTML = `
    <div class="dash-card"><div class="lbl">ข่าวทั้งหมด</div><div class="num">${total.toLocaleString()}</div></div>
    <div class="dash-card"><div class="lbl">เฉลี่ยต่อเดือน</div><div class="num">${avg.toFixed(1)}</div></div>
    <div class="dash-card"><div class="lbl" style="color:var(--blue)">ข่าวชี้แจง</div><div class="num" style="color:var(--blue)">${clarify.toLocaleString()}</div></div>
    <div class="dash-card"><div class="lbl" style="color:var(--green)">แท็กที่ใช้</div><div class="num" style="color:var(--green)">${tagCount.toLocaleString()}</div></div>`;

  const mEl = document.getElementById('dash-monthly');
  if (!monthly.length) {
    mEl.innerHTML = '<div class="dash-empty">ไม่มีข้อมูลในช่วงที่เลือก</div>';
  } else {
    const maxN = Math.max(...monthly.map(m => m.n));
    const bars = monthly.map(m => {
      const h = Math.round((m.n / maxN) * 100);
      const [y, mo] = m.ym.split('-');
      return `<div class="mbar${m.n===maxN?' max':''}" style="height:${h}%" title="${MONTHS[parseInt(mo)]} ${parseInt(y)+543}: ${m.n} ข่าว"></div>`;
    }).join('');
    const f = monthly[0].ym.split('-'), l = monthly[monthly.length-1].ym.split('-');
    mEl.innerHTML = `<div class="mbars">${bars}</div>
      <div class="mbar-x"><span>${MONTHS[parseInt(f[1])]} ${parseInt(f[0])+543}</span><span>${MONTHS[parseInt(l[1])]} ${parseInt(l[0])+543}</span></div>`;
  }

  const cats = q(`SELECT c.name nm, COUNT(*) n FROM press_releases pr LEFT JOIN categories c ON pr.category_id=c.id ${clause} GROUP BY pr.category_id ORDER BY n DESC LIMIT 8`, params);
  const cEl = document.getElementById('dash-cat');
  cEl.innerHTML = cats.length
    ? cats.map(c => `
        <div class="hbar-row">
          <div class="hbar-lbl">${esc(c.nm||'(ไม่ระบุ)')} <span>${c.n}</span></div>
          <div class="hbar-track"><div class="hbar-fill" style="width:${Math.round((c.n/cats[0].n)*100)}%"></div></div>
        </div>`).join('')
    : '<div class="dash-empty">ไม่มีข้อมูล</div>';

  const tags = q(`SELECT t.name nm, COUNT(*) n FROM tags t JOIN press_release_tags prt ON t.id=prt.tag_id JOIN press_releases pr ON prt.press_release_ref=pr.ref_code ${clause} GROUP BY t.id ORDER BY n DESC LIMIT 15`, params);
  const tEl = document.getElementById('dash-tags');
  tEl.innerHTML = tags.length
    ? `<div class="dash-tags-wrap">${tags.map(t=>`<span class="dash-tagpill">${esc(t.nm)} ${t.n}</span>`).join('')}</div>`
    : '<div class="dash-empty">ไม่มีข้อมูล</div>';
}

// ── Start ─────────────────────────────────────────────

boot().catch(err => {
  document.getElementById('load-msg').textContent = '❌ โหลดไม่สำเร็จ: ' + err.message;
  document.getElementById('load-bar').style.background = 'var(--red)';
  console.error(err);
});
</script>
